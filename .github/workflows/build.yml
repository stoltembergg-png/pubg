name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  WINDOWS_SDK_10_VERSION: 10.0.26100.0

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild PubgExt.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=${{ env.WINDOWS_SDK_10_VERSION }}

  cmake:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64

      - name: Build CMake project
        run: cmake --build build --config Release

  # Static-only compatibility verification. This job never loads a kernel
  # driver; real load testing requires a self-hosted runner with a VM snapshot
  # and must not be performed on a GitHub-hosted runner.
  verify-driver-compat:
    if: always()
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build PubgExt for compatibility checks
        run: msbuild PubgExt.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=${{ env.WINDOWS_SDK_10_VERSION }}

      - name: Check generated offsets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath 'tools\dump_offsets.py') {
            python tools/dump_offsets.py --input PubgExt/offsetdump.txt --output PubgExt/Config/Offsets.h --check
          } else {
            Write-Host 'tools\dump_offsets.py not present; skipping offset check.'
          }

      - name: Static ReadWriteDriver compatibility checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $driverRoot = Join-Path $PWD 'ReadWriteDriver'
          if (-not (Test-Path -LiteralPath $driverRoot)) {
            Write-Warning 'ReadWriteDriver source tree not present; skipping static checks.'
            exit 0
          }

          $sourceFiles = @(Get-ChildItem -LiteralPath $driverRoot -Recurse -File -Include '*.c', '*.h')
          $sourceText = (($sourceFiles | ForEach-Object {
            Get-Content -LiteralPath $_.FullName -Raw
          }) -join "`n")

          # Kernel imports must go through the resolver used by the mapper.
          if ($sourceText -notmatch '\bMmGetSystemRoutineAddress\b') {
            throw 'ReadWriteDriver has no resolvable kernel-import path (MmGetSystemRoutineAddress).'
          }
          if ($sourceText -notmatch 'MmGetSystemRoutineAddress\s*\(') {
            throw 'ReadWriteDriver does not call MmGetSystemRoutineAddress to resolve imports.'
          }
          Write-Host 'Kernel import resolver found: MmGetSystemRoutineAddress.'

          $mapperSource = Join-Path $driverRoot 'ReadWriteDriverMapper\driver.c'
          if (Test-Path -LiteralPath $mapperSource) {
            $mapperText = Get-Content -LiteralPath $mapperSource -Raw
            $importThunkWrites = @([regex]::Matches($mapperText, 'pAddrThunk->u1\.Function\s*=\s*\(UINT_PTR\)lpFunction'))
            $resolverCalls = @([regex]::Matches($mapperText, 'lpFunction\s*=\s*MmGetSystemRoutineAddress\s*\('))
            if ($importThunkWrites.Count -gt 0 -and $resolverCalls.Count -eq 0) {
              throw 'Mapper writes import thunks without a resolvable kernel-import call.'
            }
            $importAssignments = @([regex]::Matches($mapperText, '(?m)^[ \t]*lpFunction[ \t]*=[ \t]*(?<value>\S[^;\r\n]*)'))
            foreach ($assignment in $importAssignments) {
              $value = $assignment.Groups['value'].Value.Trim()
              if ($value -notmatch '^(?:NULL|MmGetSystemRoutineAddress)\b') {
                throw ("Mapper contains an import assignment that bypasses MmGetSystemRoutineAddress: {0}" -f $value)
              }
            }
            Write-Host ("Import thunk resolution path verified ({0} resolver call(s))." -f $resolverCalls.Count)
          }

          # These legacy mapper addresses are intentionally diagnostic only:
          # report them without failing this static, non-loading job.
          $hardcoded = @($sourceFiles | Select-String -Pattern '(?i)\b(?:p)?Mm(?:AllocateIndependentPages|SetPageProtection)\b[^;\r\n]*\+\s*0x[0-9a-f]+')
          foreach ($match in $hardcoded) {
            Write-Warning ("Hardcoded kernel import address (review only): {0}:{1}: {2}" -f $match.Filename, $match.LineNumber, $match.Line.Trim())
          }
          if ($hardcoded.Count -eq 0) {
            Write-Host 'No hardcoded MmAllocateIndependentPages/MmSetPageProtection address found.'
          }

          $driverSource = Join-Path $driverRoot 'ReadWriteDriver\driver.c'
          if (-not (Test-Path -LiteralPath $driverSource)) {
            throw 'ReadWriteDriver\driver.c is missing; cannot verify the win32kbase offset table.'
          }
          $driverText = Get-Content -LiteralPath $driverSource -Raw
          $offsetTable = [regex]::Match($driverText, '(?s)Win32kOffsets\s*\[\]\s*=\s*\{(?<entries>.*?)\};')
          if (-not $offsetTable.Success) {
            throw 'win32kbase offset table (Win32kOffsets) was not found.'
          }
          if ($driverText -notmatch 'GetPIDByName\(\s*"win32kbase\.sys"\s*\)') {
            throw 'ReadWriteDriver does not identify win32kbase.sys before applying its offset.'
          }
          if ($offsetTable.Groups['entries'].Value -notmatch '\{\s*[^,]+,\s*0x[0-9A-Fa-f]+\s*\}') {
            throw 'win32kbase offset table has no hexadecimal offset entry.'
          }
          if ($driverText -notmatch '\bWin32FreePoolOffset\b' -or $driverText -notmatch '\bGetWin32FreePoolOffset\b') {
            throw 'win32kbase offset table is not connected to the offset lookup.'
          }
          Write-Host 'win32kbase offset table found and connected to GetWin32FreePoolOffset.'

      - name: Verify embedded driver payload
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $driverPath = Join-Path $PWD 'ReadWriteDriver\ReadWriteDriver\x64\Release\ReadWriteDriver.sys'
          if (-not (Test-Path -LiteralPath $driverPath)) {
            Write-Host 'ReadWriteDriver.sys not found; skipping embedded payload verification.'
            exit 0
          }

          $headerPath = Join-Path $PWD 'ReadWriteDriver\ReadWriteDriverMapper\driver.h'
          if (-not (Test-Path -LiteralPath $headerPath)) {
            throw 'Embedded payload header ReadWriteDriverMapper\driver.h is missing.'
          }

          $headerText = Get-Content -LiteralPath $headerPath -Raw
          $hexData = [regex]::Match($headerText, '(?m)\bunsigned\s+char\s+hexData\s*\[\s*(?<declared>\d+)\s*\]\s*=')
          if (-not $hexData.Success) {
            throw 'hexData array was not found in ReadWriteDriverMapper\driver.h.'
          }

          $declaredSize = [int]$hexData.Groups['declared'].Value
          $driverSize = (Get-Item -LiteralPath $driverPath).Length
          if ($driverSize -ne $declaredSize) {
            throw "Embedded driver payload size mismatch: ReadWriteDriver.sys is $driverSize bytes; hexData declares $declaredSize bytes."
          }
          Write-Host "Embedded driver payload size matches ReadWriteDriver.sys ($driverSize bytes declared by hexData)."

      - name: Optional static analysis
        id: static-analysis
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clangTidy = Get-Command clang-tidy -ErrorAction SilentlyContinue
          if ($clangTidy) {
            Write-Host 'clang-tidy found; running a non-loading static analysis pass.'
            & $clangTidy.Source --version
            # The WDK driver is not loaded or executed here. Analyze only when
            # clang-tidy is available; its diagnostics are intentionally advisory.
            & $clangTidy.Source --quiet ReadWriteDriver\ReadWriteDriver\driver.c -- -x c
          } else {
            Write-Host 'clang-tidy unavailable; trying MSBuild code analysis.'
            msbuild PubgExt.sln /p:Configuration=Release /p:Platform=x64 /p:RunCodeAnalysis=true
          }

  # Opcional/best-effort: o WDK é obtido via NuGet. Falhas não bloqueiam o CI.
  build-driver:
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install WDK from NuGet
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nuget = Join-Path $env:RUNNER_TEMP 'nuget.exe'
          Invoke-WebRequest -Uri 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe' -OutFile $nuget

          $search = Invoke-RestMethod -Uri 'https://azuresearch-usnc.nuget.org/query?q=Microsoft.WindowsWDK&prerelease=false&semVerLevel=2.0.0'
          $package = @($search.data | Where-Object { $_.id -eq 'Microsoft.WindowsWDK.x64' } | Select-Object -First 1)
          if (-not $package) {
            throw 'Microsoft.WindowsWDK.x64 NuGet package was not found.'
          }

          $versions = @($package.versions | ForEach-Object {
            if ($_ -is [string]) { $_ } else { $_.version }
          } | Where-Object { $_ -like "$($env:WINDOWS_SDK_10_VERSION -replace '\.0$', '')*" } | Sort-Object { [version]$_ } -Descending)
          if (-not $versions) {
            throw "No $($package.id) package matching Windows SDK $env:WINDOWS_SDK_10_VERSION was found."
          }

          $wdkRoot = Join-Path $env:RUNNER_TEMP 'wdk'
          & $nuget install $package.id -Version $versions[0] -OutputDirectory $wdkRoot -NonInteractive -NoCache
          if ($LASTEXITCODE -ne 0) { throw "NuGet failed to install $($package.id)." }
          "WDK_NUGET_ROOT=$wdkRoot\$($package.id).$($versions[0])" >> $env:GITHUB_ENV

      - name: Check WDK
        id: wdk
        shell: pwsh
        run: |
          $wdkHeaders = @(
            "$env:ProgramFiles\Windows Kits\10\Include\*\km\ntddk.h",
            "${env:ProgramFiles(x86)}\Windows Kits\10\Include\*\km\ntddk.h",
            "$env:WDK_NUGET_ROOT\Include\*\km\ntddk.h"
          )
          if ($wdkHeaders | Where-Object { Test-Path $_ }) {
            "installed=true" >> $env:GITHUB_OUTPUT
            Write-Host "WDK found; the driver solution will be built."
          } else {
            "installed=false" >> $env:GITHUB_OUTPUT
            Write-Host "WDK not found; skipping optional driver build."
          }

      - name: Build driver solution
        id: driver_build
        if: steps.wdk.outputs.installed == 'true'
        shell: pwsh
        run: msbuild ReadWriteDriver/ReadWriteKernel.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=${{ env.WINDOWS_SDK_10_VERSION }} /p:WDKContentRoot="$env:WDK_NUGET_ROOT"

      - name: Warn when driver build fails
        if: failure() && steps.driver_build.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Output '::warning::Driver build failed - it requires the WDK and the WindowsKernelModeDriver10.0 KMDF toolset; real load validation requires a self-hosted runner with a VM snapshot.'

      - name: Report skipped driver build
        if: steps.wdk.outputs.installed != 'true'
        shell: pwsh
        run: |
          Write-Output '::warning::ReadWriteKernel.sln was not built - the WDK / WindowsKernelModeDriver10.0 KMDF toolset is unavailable on this runner. Real driver load validation requires a self-hosted runner with a VM snapshot.'
